name: build

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C c/test

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: build (unsigned compile check, sdkconfig.ci)
        working-directory: c
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build-ci -DSDKCONFIG=build-ci/sdkconfig \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci" -DTMM_NO_UPLOAD=1 build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-unsigned-no-ota
          path: |
            c/build-ci/tedder-metar-map.bin
            c/build-ci/bootloader/bootloader.bin
            c/build-ci/partition_table/partition-table.bin
            c/build-ci/ota_data_initial.bin
            c/build-ci/flash_args
